server:
  port: 8082   # catalog is 8081, so seating gets 8082

spring:
  application:
    name: seating-service

  datasource:
    url: jdbc:postgresql://localhost:5432/seating_db
    username: seating_user
    password: seating_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # let it create tables for now
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
