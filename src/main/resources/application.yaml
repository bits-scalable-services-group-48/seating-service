server:
  port: 8082   # catalog is 8081, so seating gets 8082

spring:
  application:
    name: seating-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/seating_db}
    username: ${SPRING_DATASOURCE_USERNAME:seating_user}
    password: ${SPRING_DATASOURCE_PASSWORD:seating_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
